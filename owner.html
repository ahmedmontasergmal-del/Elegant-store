<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#071f20">
<title>OWNER | ELEGANT</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#071f20;--panel:#0d3030;--gold:#d7bd86;--muted:#a9c0b9}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(ellipse at 50% 0,#174a46,var(--bg) 65%);font-family:Cairo,sans-serif;color:#f7f5ee}.box{width:min(430px,100%);padding:38px 30px;background:#0b2929ed;border:1px solid #c9ad6b66;box-shadow:0 25px 80px #0008;text-align:center}.gem{font-size:30px;color:var(--gold)}h1{font:700 34px 'Playfair Display';letter-spacing:5px;color:var(--gold);margin:8px 0 0}h2{font-size:15px;font-weight:500;margin:8px 0 28px;color:var(--muted)}label{display:block;text-align:right;font-size:12px;margin:16px 0 6px;color:#d8d0bd}input{width:100%;padding:13px 14px;background:#061d1e;border:1px solid #42605b;color:white;outline:none;font:14px Cairo}input:focus{border-color:var(--gold)}button{width:100%;margin-top:22px;padding:13px;border:0;background:linear-gradient(120deg,#e2d1a6,#b9975d);color:#102e2c;font:700 14px Cairo;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.note{min-height:26px;margin-top:16px;font-size:12px;color:#e8c98b}.back{display:inline-block;margin-top:18px;color:#a9c0b9;font-size:12px;text-decoration:none}.hidden{display:none!important}.welcome{font-size:14px;line-height:2;color:#d6e4de}
</style>
</head>
<body><main class="box">
<div class="gem">◇</div><h1>ELEGANT</h1><h2>OWNER CONTROL ACCESS</h2>
<form id="loginForm">
<label for="username">اسم المستخدم</label><input id="username" autocomplete="username" value="OWNER" required>
<label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required>
<button id="submit" type="submit">تسجيل الدخول</button><div class="note" id="message" role="status"></div>
</form>
<section id="welcome" class="hidden"><p class="welcome">تم تسجيل الدخول بنجاح بصلاحية OWNER.</p><button id="logout">تسجيل الخروج</button></section>
<a class="back" href="./">العودة إلى المتجر</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./supabase-config.js"></script>
<script>
const form=document.getElementById('loginForm'),msg=document.getElementById('message'),btn=document.getElementById('submit'),welcome=document.getElementById('welcome');
const configured=window.ELEGANT_SUPABASE_URL&&!window.ELEGANT_SUPABASE_URL.includes('YOUR_')&&window.ELEGANT_SUPABASE_ANON_KEY&&!window.ELEGANT_SUPABASE_ANON_KEY.includes('YOUR_');
let client=null;
if(configured&&window.supabase)client=window.supabase.createClient(window.ELEGANT_SUPABASE_URL,window.ELEGANT_SUPABASE_ANON_KEY);
function status(t){msg.textContent=t}
async function checkSession(){if(!client)return;const {data:{session}}=await client.auth.getSession();if(!session)return;const {data,error}=await client.from('owner_profiles').select('role').eq('id',session.user.id).maybeSingle();if(!error&&data?.role==='owner'){form.classList.add('hidden');welcome.classList.remove('hidden')}else{await client.auth.signOut();status('الحساب ده مش معاه صلاحية OWNER.')}}
form.addEventListener('submit',async e=>{e.preventDefault();if(!client){status('إعداد الربط غير مكتمل. راجع ملف SETUP-OWNER.md.');return}const username=document.getElementById('username').value.trim().toUpperCase();if(username!=='OWNER'){status('اسم المستخدم غير صحيح.');return}btn.disabled=true;status('جارٍ التحقق...');try{const {data,error}=await client.auth.signInWithPassword({email:'owner@elegant-store.com',password:document.getElementById('password').value});if(error)throw error;const {data:profile,error:profileError}=await client.from('owner_profiles').select('role').eq('id',data.user.id).maybeSingle();if(profileError||profile?.role!=='owner'){await client.auth.signOut();throw new Error('تم الدخول لكن الحساب غير معتمد كمالك للموقع.')}form.classList.add('hidden');welcome.classList.remove('hidden');}catch(err){status(err.message==='Invalid login credentials'?'اسم المستخدم أو كلمة المرور غير صحيحة.':err.message||'تعذر تسجيل الدخول.')}finally{btn.disabled=false}});
document.getElementById('logout').addEventListener('click',async()=>{if(client)await client.auth.signOut();welcome.classList.add('hidden');form.classList.remove('hidden');document.getElementById('password').value='';status('تم تسجيل الخروج.')});
checkSession();
</script></body></html>
